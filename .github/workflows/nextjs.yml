name: Deploy Next.js site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [invasion_inventory_updated]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-inventory:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate and normalize sheet inventory
        env:
          INVASION_INVENTORY_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: npm run sync:invasion-inventory
      - name: Upload sanitized inventory
        uses: actions/upload-artifact@v4
        with:
          name: sanitized-invasion-inventory
          path: src/content/invasion-listings-data.json
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [sync-inventory]
    if: always() && (needs.sync-inventory.result == 'success' || needs.sync-inventory.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download sanitized inventory
        if: github.event_name == 'repository_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: sanitized-invasion-inventory
          path: ./synced-inventory
      - name: Apply validated inventory
        if: github.event_name == 'repository_dispatch'
        run: cp synced-inventory/invasion-listings-data.json src/content/invasion-listings-data.json
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Run content tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Audit canonical pages and legacy redirects
        run: npm run audit:seo
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  commit-inventory:
    if: github.event_name == 'repository_dispatch'
    needs: [sync-inventory, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Download sanitized inventory
        uses: actions/download-artifact@v4
        with:
          name: sanitized-invasion-inventory
          path: ./synced-inventory
      - name: Commit sanitized inventory
        run: |
          cp synced-inventory/invasion-listings-data.json src/content/invasion-listings-data.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/invasion-listings-data.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync Invasion inventory"
            git push origin HEAD:main
          fi

  deploy:
    if: always() && needs.build.result == 'success' && (needs.commit-inventory.result == 'success' || needs.commit-inventory.result == 'skipped')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, commit-inventory]
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
